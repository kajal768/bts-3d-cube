<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating BTS Gallery</title>
    <link rel="stylesheet" href="style4.css">
</head>
<body>

    <!-- Floating BTS text -->
    <span class="bts-text">BTS</span>

    <div class="slider">
        <span style="--i:1"><img src="rm2.jpg" alt="RM"></span>
        <span style="--i:2"><img src="jhope2.jpg" alt="J-Hope"></span>
        <span style="--i:3"><img src="jin.jpeg" alt="Jin"></span>
        <span style="--i:4"><img src="jimin2.jpg" alt="Jimin"></span>
        <span style="--i:5"><img src="suga2.jpg" alt="Suga"></span>
        <span style="--i:6"><img src="jk2.jpg" alt="Jungkook"></span>
        <span style="--i:7"><img src="v image.webp" alt="V"></span>
        <span style="--i:8"><img src="bts team.jpg" alt="BTS Team"></span>
    </div>

    <!-- Floating GIF/video -->
    <video class="bts-gif" autoplay muted loop>
        <source src="bts gif.mp4" type="video/mp4">
    </video>

    <script src="script.js"></script>
</body>
</html>
